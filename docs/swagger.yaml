info:
  contact: {}
paths:
  /auth/{provider}:
    get:
      description: that route is use to authenticate with social media
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: social auth
      tags:
      - authentication
  /auth/{provider}/callback:
    get:
      description: that route is use to authenticate with social media
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Login'
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      summary: social auth callback
      tags:
      - authentication
  /auth/fetchlogindata:
    get:
      consumes:
      - application/json
      description: that route is use to fetch login data
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Login'
        "400":
          description: Bad Request
          schema:
            type: string
        "403":
          description: Forbidden
          schema:
            type: string
        "500":
          description: Internal Server Error
          schema:
            type: string
      security:
      - Bearer: []
      summary: fetch login data
      tags:
      - authentication
  /badges:
    get:
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.Badge'
            type: array
      summary: all badges that can be earned
      tags:
      - gamification
  /blood-bank:
    post:
      consumes:
      - application/json
      description: any donor can request a blood bank for an upazila; a platform admin
        approves it and the creator becomes its admin
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: name, description, division, district, upazila, address, contact_phone
        in: body
        name: bank
        required: true
        schema:
          $ref: '#/definitions/model.BloodBank'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BloodBank'
        "400":
          description: Bad Request
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - Bearer: []
      summary: request a new blood bank
      tags:
      - blood banks
  /blood-bank/{id}:
    get:
      parameters:
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BloodBank'
        "404":
          description: Not Found
          schema:
            type: string
      summary: get a blood bank
      tags:
      - blood banks
    put:
      consumes:
      - application/json
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: name, description, address, contact_phone, logo
        in: body
        name: bank
        required: true
        schema:
          $ref: '#/definitions/model.BloodBank'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BloodBank'
      security:
      - Bearer: []
      summary: edit a blood bank (bank admin)
      tags:
      - blood banks
  /blood-bank/{id}/{action}:
    put:
      consumes:
      - application/json
      description: 'approve: pending or suspended -> approved; reject: pending ->
        rejected; suspend: approved -> suspended. reject and suspend need a reason.'
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: approve | reject | suspend
        in: path
        name: action
        required: true
        type: string
      - description: reason
        in: body
        name: review
        schema:
          $ref: '#/definitions/model.BankReview'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.BloodBank'
        "403":
          description: Forbidden
          schema:
            type: string
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - Bearer: []
      summary: approve, reject or suspend a blood bank (platform admin)
      tags:
      - blood banks
  /blood-bank/{id}/conversation:
    get:
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.Conversation'
      security:
      - Bearer: []
      summary: the blood bank's group chat (members only)
      tags:
      - blood banks
  /blood-bank/{id}/join:
    post:
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/model.MyBloodBank'
        "409":
          description: Conflict
          schema:
            type: string
      security:
      - Bearer: []
      summary: ask to join a blood bank
      tags:
      - blood banks
  /blood-bank/{id}/leaderboard:
    get:
      parameters:
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: all (default) | month
        in: query
        name: period
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.LeaderboardEntry'
            type: array
      summary: top donors of a blood bank
      tags:
      - gamification
  /blood-bank/{id}/member/{userId}:
    delete:
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: user id
        in: path
        name: userId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - Bearer: []
      summary: remove a member (bank admin / officer)
      tags:
      - blood banks
  /blood-bank/{id}/member/{userId}/{action}:
    put:
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: user id
        in: path
        name: userId
        required: true
        type: integer
      - description: approve | reject
        in: path
        name: action
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - Bearer: []
      summary: approve or reject a join request (bank admin / officer)
      tags:
      - blood banks
  /blood-bank/{id}/member/{userId}/role:
    put:
      consumes:
      - application/json
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: user id
        in: path
        name: userId
        required: true
        type: integer
      - description: role (officer | member), position
        in: body
        name: role
        required: true
        schema:
          $ref: '#/definitions/model.BankMemberRoleUpdate'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BankMember'
            type: array
      security:
      - Bearer: []
      summary: set a member's role and position (bank admin)
      tags:
      - blood banks
  /blood-bank/{id}/members:
    get:
      description: active members are public; pending requests are visible to the
        bank admin and officers
      parameters:
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      - description: active (default) | pending
        in: query
        name: status
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/model.BankMember'
            type: array
      summary: list blood bank members
      tags:
      - blood banks
  /blood-bank/{id}/membership:
    delete:
      description: the bank admin must transfer admin first
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
        description: Bearer Token
        in: header
        name: Authorization
        required: true
        type: string
      - description: blood bank id
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            type: string
      security:
      - Bearer: []
      summary: leave a blood bank or cancel a join request
      tags:
      - blood banks
  /blood-bank/{id}/transfer-admin:
    put:
      consumes:
      - application/json
      parameters:
      - default: '"Bearer YOUR_ACCESS_TOKEN"'
