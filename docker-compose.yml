version: "3"

services:
  server:
    image: bloodlink-server
    container_name: bloodlink-server
    build:
      dockerfile: Dockerfile
      context: .
    depends_on:
      - postgres
    ports:
      - "8787:8080"
    networks:
      - my-network

  postgres:
    image: postgres:16.0
    container_name: bloodlink-postgres
    ports:
      - "5400:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: BloodLinkDB
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - my-network
    hostname: postgreshost
volumes:
  postgres-data:

networks:
  my-network:
    external: true
