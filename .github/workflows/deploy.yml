name: Build & Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production
  cancel-in-progress: false

env:
  APP_DIR: /opt/bloodlink
  BIN_NAME: bloodlink-server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Vet
        run: go vet ./...

      - name: Build (linux/amd64, static)
        env:
          CGO_ENABLED: "0"
          GOOS: linux
          GOARCH: amd64
        run: go build -trimpath -ldflags="-s -w" -o ${{ env.BIN_NAME }} .

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}
          path: ${{ env.BIN_NAME }}
          retention-days: 7

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ env.BIN_NAME }}

      - name: Set up SSH
        env:
          SSH_KEY: ${{ secrets.VPS_SSH_KEY }}
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/id_deploy
          chmod 600 ~/.ssh/id_deploy
          ssh-keyscan -p "$SSH_PORT" -H "$SSH_HOST" >> ~/.ssh/known_hosts

      - name: Upload binary
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          scp -i ~/.ssh/id_deploy -P "$SSH_PORT" \
            "$BIN_NAME" "$SSH_USER@$SSH_HOST:$APP_DIR/$BIN_NAME.new"

      - name: Swap binary, restart, health check (auto-rollback)
        env:
          SSH_HOST: ${{ secrets.VPS_HOST }}
          SSH_USER: ${{ secrets.VPS_USER }}
          SSH_PORT: ${{ secrets.VPS_PORT || '22' }}
        run: |
          ssh -i ~/.ssh/id_deploy -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            APP_DIR="$APP_DIR" BIN="$BIN_NAME" 'bash -s' <<'REMOTE'
          set -eu
          cd "$APP_DIR"
          chmod 755 "$BIN.new"
          if [ -f "$BIN" ]; then cp -f "$BIN" "$BIN.prev"; fi
          mv -f "$BIN.new" "$BIN"
          sudo systemctl restart bloodlink

          PORT=$(sed -n 's/.*"serverPort"[[:space:]]*:[[:space:]]*"\([0-9]*\)".*/\1/p' config.json | head -n1)
          for i in $(seq 1 15); do
            if curl -fsS "http://127.0.0.1:$PORT/ping" >/dev/null; then
              echo "Deploy OK (port $PORT)"
              exit 0
            fi
            sleep 2
          done

          echo "Health check failed, rolling back" >&2
          journalctl -u bloodlink -n 50 --no-pager || true
          if [ -f "$BIN.prev" ]; then
            mv -f "$BIN.prev" "$BIN"
            sudo systemctl restart bloodlink
          fi
          exit 1
          REMOTE

      - name: Clean up key
        if: always()
        run: rm -f ~/.ssh/id_deploy
